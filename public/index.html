<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Claude UI</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' fill='%23d97757'/%3E%3Cpath d='M4 5l3 3-3 3M8 11h4' stroke='%23fff' stroke-width='1.6' fill='none'/%3E%3C/svg%3E">
<script nonce="__NONCE__">try { document.documentElement.dataset.theme = localStorage.getItem('theme') || 'dark'; } catch {}</script>
<script nonce="__NONCE__" src="https://cdnjs.cloudflare.com/ajax/libs/marked/18.0.14/lib/marked.umd.min.js" integrity="sha512-trN9mtGYvoySPVI909KTnwbJI9AkKPydRCV/qAsUG1+q39hhpKltEag9b5JpdjeIZn5i8IH62hHRFdbKwMFh9w==" crossorigin="anonymous" referrerpolicy="no-referrer"></script>
<script nonce="__NONCE__" src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.11.1/highlight.min.js" integrity="sha512-EBLzUL8XLl+va/zAsmXwS7Z2B1F9HUHkZwyS/VKwh3S7T/U0nF4BaU29EP/ZSf6zgiIxYAnKLu6bJ8dqpmX5uw==" crossorigin="anonymous" referrerpolicy="no-referrer"></script>
<style>
:root {
  --sans: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --mono: ui-monospace, "SF Mono", "JetBrains Mono", Menlo, Consolas, monospace;
}
:root, [data-theme="dark"] {
  color-scheme: dark;
  --bg: #0f1012; --bg-1: #16181b; --bg-2: #1e2125; --line: #2a2e34;
  --fg: #dcdee1; --dim: #8b919a; --faint: #5d636c;
  --accent: #d97757; --ok: #6cbf84; --err: #e57373; --warn: #d9a94e; --link: #7cb7ff;
  --add-bg: #12261a; --del-bg: #2c1517;
  --hl-kw: #ff7b72; --hl-str: #a5d6ff; --hl-num: #79c0ff; --hl-fn: #d2a8ff;
  --hl-com: #7d858f; --hl-type: #ffa657; --hl-attr: #7ee787;
}
[data-theme="light"] {
  color-scheme: light;
  --bg: #fbfbfa; --bg-1: #f2f2ef; --bg-2: #e7e7e3; --line: #d9d9d4;
  --fg: #1f2328; --dim: #5d646e; --faint: #9aa0a7;
  --accent: #b9542d; --ok: #2d8546; --err: #c23b3b; --warn: #946400; --link: #0a5fc2;
  --add-bg: #e3f4e7; --del-bg: #fbe5e5;
  --hl-kw: #cf222e; --hl-str: #0a3069; --hl-num: #0550ae; --hl-fn: #8250df;
  --hl-com: #6e7781; --hl-type: #953800; --hl-attr: #116329;
}
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body {
  display: flex; flex-direction: column;
  background: var(--bg); color: var(--fg); font: 14px/1.5 var(--sans);
}
button {
  font: 12px var(--sans); color: var(--fg); background: var(--bg-2);
  border: 1px solid var(--line); border-radius: 3px; padding: 3px 9px; cursor: pointer;
}
button:hover { border-color: var(--dim); }
button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
button.danger { background: var(--err); border-color: var(--err); color: #fff; }
button.ghost { background: none; border-color: transparent; color: var(--dim); }
button.ghost:hover { color: var(--fg); border-color: var(--line); }

/* top bar */
#top {
  display: flex; align-items: center; gap: 10px; padding: 4px 12px;
  background: var(--bg-1); border-bottom: 1px solid var(--line); font-size: 12px;
}
#top .brand { font: 600 12px var(--mono); color: var(--accent); }
#top .spacer { flex: 1; }
#top #side-btn { padding: 0 4px; font-size: 14px; }
#banner {
  padding: 5px 12px; font-size: 12.5px; display: flex; gap: 10px; align-items: center;
  background: var(--bg-2); border-bottom: 1px solid var(--line);
}
#banner[hidden] { display: none; }
#banner.warn { color: var(--warn); }
#banner.err { color: var(--err); }

/* layout */
#workspace { flex: 1; display: grid; grid-template-columns: 260px minmax(0, 1fr); min-height: 0; }
body.side-hidden #workspace { grid-template-columns: minmax(0, 1fr); }
body.side-hidden #side { display: none; }
#main { display: grid; grid-template-rows: minmax(0, 1fr) auto; min-height: 0; }

/* sidebar */
#side {
  display: flex; flex-direction: column; min-height: 0; font-size: 12.5px;
  background: var(--bg-1); border-right: 1px solid var(--line);
}
#side section { padding: 8px 10px; border-bottom: 1px solid var(--line); }
#side section.grow { flex: 1; overflow-y: auto; border-bottom: 0; }
.side-h {
  display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px;
  font: 600 11px var(--sans); letter-spacing: .05em; text-transform: uppercase; color: var(--dim);
}
#side input {
  width: 100%; font: 12px var(--mono); color: var(--fg); background: var(--bg);
  border: 1px solid var(--line); border-radius: 3px; padding: 4px 6px; outline: none;
}
#side input:focus { border-color: var(--dim); }
#side ul { list-style: none; margin: 6px 0 0; padding: 0; }
#side li { padding: 3px 6px; border-radius: 3px; cursor: pointer; }
#side li:hover { background: var(--bg-2); }
#side li.active { background: var(--bg-2); box-shadow: inset 2px 0 var(--accent); }
#recent li { font: 11.5px var(--mono); color: var(--dim); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
#recent li.active { color: var(--fg); }
.s-title { display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.s-meta { font: 10.5px var(--mono); color: var(--faint); }
.empty { color: var(--faint); font-size: 12px; padding: 3px 6px; }
#resume-form { margin-top: 10px; }
@media (max-width: 760px) {
  #workspace { grid-template-columns: minmax(0, 1fr); }
  #side { position: fixed; z-index: 5; top: 29px; bottom: 0; left: 0; width: 280px; box-shadow: 4px 0 12px rgb(0 0 0 / .3); }
}

/* transcript */
#chat { overflow-y: auto; min-height: 0; }
#log { max-width: 940px; margin: 0 auto; padding: 10px 16px 28px; }
.msg { margin: 8px 0; }
.user {
  background: var(--bg-1); border-left: 2px solid var(--accent);
  padding: 5px 10px; white-space: pre-wrap; word-break: break-word;
}
.notice { font: 12px var(--mono); color: var(--dim); margin: 6px 0; white-space: pre-wrap; }
.notice.err { color: var(--err); }
.notice.warn { color: var(--warn); }
.turn-end { font: 11.5px var(--mono); color: var(--faint); margin: 4px 0 14px; }
.turn-end.err { color: var(--err); }
.thinking { font: 12px var(--mono); color: var(--faint); margin: 4px 0; }
.thinking[open] > summary, .thinking > summary { cursor: pointer; }
.thinking pre { color: var(--dim); }

/* markdown */
.md > :first-child { margin-top: 0; }
.md > :last-child { margin-bottom: 0; }
.md p, .md ul, .md ol, .md blockquote, .md table { margin: 6px 0; }
.md ul, .md ol { padding-left: 22px; }
.md h1, .md h2, .md h3, .md h4 { margin: 14px 0 6px; line-height: 1.3; }
.md h1 { font-size: 18px; } .md h2 { font-size: 16px; } .md h3, .md h4 { font-size: 14px; }
.md a { color: var(--link); }
.md a:not([href]) { color: inherit; }
.md blockquote { border-left: 2px solid var(--line); margin-left: 0; padding-left: 10px; color: var(--dim); }
.md table { border-collapse: collapse; font-size: 13px; }
.md th, .md td { border: 1px solid var(--line); padding: 3px 8px; text-align: left; }
.md th { background: var(--bg-1); }
.md hr { border: 0; border-top: 1px solid var(--line); }
.md :not(pre) > code {
  font: 12.5px var(--mono); background: var(--bg-2); padding: 1px 4px; border-radius: 3px;
}
pre {
  font: 12.5px/1.45 var(--mono); background: var(--bg-1); border: 1px solid var(--line);
  padding: 8px 10px; overflow-x: auto; margin: 6px 0; border-radius: 3px;
}
.codewrap { position: relative; }
.codewrap .copy { position: absolute; top: 4px; right: 4px; font-size: 11px; padding: 1px 6px; opacity: 0; }
.codewrap:hover .copy { opacity: 1; }
.img-ref { font: 12px var(--mono); color: var(--dim); }

/* syntax highlighting (highlight.js classes) */
.hljs-keyword, .hljs-selector-tag, .hljs-meta .hljs-keyword, .hljs-doctag { color: var(--hl-kw); }
.hljs-string, .hljs-regexp, .hljs-meta .hljs-string { color: var(--hl-str); }
.hljs-number, .hljs-literal, .hljs-symbol, .hljs-variable.language_ { color: var(--hl-num); }
.hljs-title, .hljs-title.function_, .hljs-section { color: var(--hl-fn); }
.hljs-comment, .hljs-quote { color: var(--hl-com); font-style: italic; }
.hljs-type, .hljs-built_in, .hljs-title.class_, .hljs-params { color: var(--hl-type); }
.hljs-attr, .hljs-attribute, .hljs-name, .hljs-selector-class, .hljs-selector-id, .hljs-tag { color: var(--hl-attr); }
.hljs-meta { color: var(--dim); }
.hljs-addition { color: var(--ok); background: var(--add-bg); }
.hljs-deletion { color: var(--err); background: var(--del-bg); }

/* tool cards */
.tool {
  border: 1px solid var(--line); background: var(--bg-1); margin: 4px 0;
  font: 12.5px/1.45 var(--mono); border-radius: 3px;
}
.tool > summary {
  display: flex; gap: 8px; align-items: baseline; padding: 3px 8px;
  cursor: pointer; list-style: none; white-space: nowrap; overflow: hidden;
}
.tool > summary::-webkit-details-marker { display: none; }
.tool > summary::before { content: "\25B8"; color: var(--faint); }
.tool[open] > summary::before { content: "\25BE"; }
.tstatus::before { content: "\25CF"; }
.tool[data-status="running"] .tstatus { color: var(--warn); animation: pulse 1.2s ease-in-out infinite; }
.tool[data-status="done"] .tstatus { color: var(--ok); }
.tool[data-status="error"] .tstatus { color: var(--err); }
.tool[data-status="stopped"] .tstatus { color: var(--faint); }
@keyframes pulse { 50% { opacity: .3; } }
.tname { font-weight: 600; }
.tdesc { color: var(--dim); overflow: hidden; text-overflow: ellipsis; min-width: 0; }
.tbody pre {
  margin: 0; border: 0; border-top: 1px solid var(--line); border-radius: 0; background: none;
  max-height: 380px; overflow: auto; white-space: pre-wrap; word-break: break-word;
}
.tbody .tout { color: var(--dim); }
.tool[data-status="error"] .tout { color: var(--err); }
.tkids { padding: 2px 6px 2px 14px; border-top: 1px solid var(--line); font-family: var(--sans); }
.tkids:empty { display: none; }
.ln-add { background: var(--add-bg); color: var(--ok); display: block; }
.ln-del { background: var(--del-bg); color: var(--err); display: block; }

/* status bar */
#status {
  display: flex; align-items: center; padding: 2px 12px; min-width: 0;
  font: 11.5px/1.6 var(--mono); color: var(--dim); white-space: nowrap; overflow: hidden;
  background: var(--bg-1); border-top: 1px solid var(--line);
}
#status .sep { color: var(--faint); margin: 0 8px; }
#status .grow { flex: 1; }
#status .warn { color: var(--warn); }
#status .err { color: var(--err); }
#status .clip { overflow: hidden; text-overflow: ellipsis; min-width: 0; }
#status button { all: unset; cursor: pointer; }
#status button:hover { color: var(--fg); text-decoration: underline; }

/* permission prompts */
.perm { border: 1px solid var(--warn); background: var(--bg-1); margin: 6px 0; border-radius: 3px; font-size: 13px; }
.perm.settled { border-color: var(--line); opacity: .7; }
.perm-h { display: flex; gap: 8px; align-items: baseline; padding: 5px 10px; }
.perm-tag { font: 600 10.5px var(--mono); letter-spacing: .05em; text-transform: uppercase; color: var(--warn); }
.perm.settled .perm-tag { color: var(--faint); }
.perm-title { color: var(--dim); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
.perm > pre {
  margin: 0; border: 0; border-top: 1px solid var(--line); border-radius: 0; background: none;
  max-height: 320px; overflow: auto; white-space: pre-wrap; word-break: break-word;
}
.perm-plan { padding: 6px 12px; border-top: 1px solid var(--line); max-height: 55vh; overflow: auto; }
.perm-why { padding: 4px 10px; font: 12px var(--mono); color: var(--dim); border-top: 1px solid var(--line); }
.perm-actions, .perm-done { display: flex; gap: 8px; padding: 6px 10px; border-top: 1px solid var(--line); }
.perm-done { font: 12px var(--mono); color: var(--dim); }
.q { padding: 6px 10px; border-top: 1px solid var(--line); }
.q-text { font-weight: 600; margin-bottom: 6px; }
.q-opts { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 6px; }
.q-opts button { text-align: left; max-width: 280px; }
.q-opts button span { display: block; color: var(--dim); font-size: 11px; }
.q-opts button.picked { border-color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent); }
.q-other {
  width: 100%; font: 12.5px var(--sans); color: var(--fg); background: var(--bg);
  border: 1px solid var(--line); border-radius: 3px; padding: 4px 8px; outline: none;
}
button.deny { color: var(--err); }

/* composer */
#composer {
  border-top: 1px solid var(--line); background: var(--bg-1); padding: 8px 16px;
}
#composer .row { max-width: 940px; margin: 0 auto; display: flex; gap: 8px; align-items: flex-end; }
#input {
  flex: 1; resize: none; max-height: 40vh; min-height: 34px;
  font: 14px/1.45 var(--sans); color: var(--fg); background: var(--bg);
  border: 1px solid var(--line); border-radius: 3px; padding: 6px 10px; outline: none;
}
#input:focus { border-color: var(--dim); }
#send { height: 34px; min-width: 76px; font-size: 13px; }
#composer .sub { margin-top: 6px; justify-content: space-between; align-items: center; font-size: 11.5px; color: var(--faint); }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 3px; overflow: hidden; }
.seg button { border: 0; border-radius: 0; background: none; color: var(--dim); padding: 2px 10px; font-size: 11.5px; }
.seg button + button { border-left: 1px solid var(--line); }
.seg button.on { background: var(--bg-2); color: var(--fg); }
.seg button.on[data-mode="acceptEdits"] { color: var(--warn); }
.seg button.on[data-mode="plan"] { color: var(--link); }
</style>
</head>
<body>
<header id="top">
  <button id="side-btn" class="ghost" type="button" title="Toggle sidebar">&#9776;</button>
  <span class="brand">claude-ui</span>
  <span class="spacer"></span>
  <button id="theme-btn" class="ghost" type="button" title="Toggle light/dark">theme</button>
</header>
<div id="banner" hidden></div>
<div id="workspace">
  <aside id="side">
    <section>
      <div class="side-h">Directory</div>
      <form id="cwd-form"><input id="cwd-input" spellcheck="false" autocomplete="off" placeholder="~/path/to/project"></form>
      <ul id="recent"></ul>
    </section>
    <section class="grow">
      <div class="side-h">Sessions <button id="new-btn" type="button">New</button></div>
      <ul id="sessions"></ul>
      <form id="resume-form"><input id="resume-input" spellcheck="false" autocomplete="off" placeholder="Resume by session ID"></form>
    </section>
  </aside>
  <div id="main">
    <main id="chat"><div id="log"></div></main>
    <form id="composer">
      <div class="row">
        <textarea id="input" rows="1" placeholder="Message Claude  (Enter to send, Shift+Enter for newline)" autofocus></textarea>
        <button id="send" class="primary" type="submit">Send</button>
      </div>
      <div class="row sub">
        <div id="modes" class="seg" title="Permission mode">
          <button type="button" data-mode="default">ask</button>
          <button type="button" data-mode="acceptEdits">accept edits</button>
          <button type="button" data-mode="plan">plan</button>
        </div>
        <span>Esc stops the run</span>
      </div>
    </form>
  </div>
</div>

<footer id="status"></footer>

<script nonce="__NONCE__">
'use strict';
const $ = (s) => document.querySelector(s);
function h(tag, cls, text) {
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (text != null) e.textContent = text;
  return e;
}

const chat = $('#chat'), log = $('#log'), input = $('#input'), sendBtn = $('#send');
const app = { ws: null, running: false, cwd: '', home: '', sessionId: null, sessions: [], recentDirs: [] };

// ---------- theme
$('#theme-btn').addEventListener('click', () => {
  const t = document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark';
  document.documentElement.dataset.theme = t;
  try { localStorage.setItem('theme', t); } catch {}
});

// ---------- scrolling: follow output only while the user is at the bottom
let stick = true;
chat.addEventListener('scroll', () => {
  stick = chat.scrollHeight - chat.scrollTop - chat.clientHeight < 40;
});
function follow() { if (stick) chat.scrollTop = chat.scrollHeight; }

// ---------- markdown (raw HTML is escaped; output is filtered through a tag allowlist)
const escapeHtml = (s) => s.replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c]);
marked.use({ gfm: true, renderer: { html: (token) => escapeHtml(token.text) } });
hljs.configure({ ignoreUnescapedHTML: true });

const OK_TAGS = new Set(['P', 'H1', 'H2', 'H3', 'H4', 'H5', 'H6', 'UL', 'OL', 'LI', 'STRONG', 'EM', 'DEL', 'S',
  'CODE', 'PRE', 'BLOCKQUOTE', 'A', 'TABLE', 'THEAD', 'TBODY', 'TR', 'TH', 'TD', 'HR', 'BR', 'INPUT', 'SPAN', 'SUP', 'SUB', 'KBD']);

function mdFragment(src) {
  const t = document.createElement('template');
  t.innerHTML = marked.parse(src);
  for (const node of [...t.content.querySelectorAll('*')]) {
    if (node.tagName === 'IMG') {
      // Never load remote images: a URL could carry data out.
      node.replaceWith(h('span', 'img-ref', `[image: ${node.getAttribute('alt') || ''}] ${node.getAttribute('src') || ''}`));
      continue;
    }
    if (!OK_TAGS.has(node.tagName) || (node.tagName === 'INPUT' && node.getAttribute('type') !== 'checkbox')) {
      node.replaceWith(document.createTextNode(node.textContent));
      continue;
    }
    for (const { name, value } of [...node.attributes]) {
      const keep = (name === 'href' && /^(https?:|mailto:|#)/i.test(value.trim()))
        || (name === 'class' && node.tagName === 'CODE')
        || (node.tagName === 'INPUT' && (name === 'type' || name === 'checked' || name === 'disabled'))
        || name === 'start' || name === 'align';
      if (!keep) node.removeAttribute(name);
    }
    if (node.tagName === 'A') { node.target = '_blank'; node.rel = 'noopener noreferrer'; }
  }
  return t.content;
}

function decorateCode(root) {
  for (const code of root.querySelectorAll('pre > code')) {
    try { hljs.highlightElement(code); } catch {}
    const pre = code.parentElement;
    const wrap = h('div', 'codewrap');
    const btn = h('button', 'copy', 'copy');
    btn.type = 'button';
    btn.addEventListener('click', () => {
      navigator.clipboard.writeText(code.textContent).then(() => {
        btn.textContent = 'copied';
        setTimeout(() => (btn.textContent = 'copy'), 1200);
      });
    });
    pre.replaceWith(wrap);
    wrap.append(pre, btn);
  }
}

// ---------- transcript blocks
const cards = new Map();    // tool_use_id -> card
const blocks = new Map();   // `${messageId}:${index}` -> streaming block
const current = new Map();  // scope (parent_tool_use_id or '') -> streaming message id
const streamed = new Set(); // message ids already rendered from stream events

const containerFor = (scope) => (scope && cards.get(scope)?.kids) || log;

function textBlock(container, raw = '') {
  const b = { kind: 'text', el: h('div', 'msg md'), raw, done: false, pending: false };
  container.append(b.el);
  return b;
}
function renderText(b) {
  b.el.replaceChildren(mdFragment(b.raw));
  if (b.done) decorateCode(b.el);
  follow();
}
function scheduleRender(b) {
  if (b.pending) return;
  b.pending = true;
  requestAnimationFrame(() => { b.pending = false; renderText(b); });
}

function thinkingBlock(container) {
  const el = h('details', 'thinking');
  const summary = h('summary', null, 'thinking…');
  const body = h('pre');
  el.append(summary, body);
  container.append(el);
  return { kind: 'thinking', el, summary, body, raw: '' };
}

function notice(text, cls = '') {
  log.append(h('div', `notice ${cls}`, text));
  follow();
}

function userBubble(text) {
  log.append(h('div', 'msg user', text));
  stick = true;
  follow();
}

// ---------- tool cards
function toolCard(id, name, container) {
  const el = h('details', 'tool');
  el.dataset.status = 'running';
  const summary = h('summary');
  const desc = h('span', 'tdesc');
  summary.append(h('span', 'tstatus'), h('span', 'tname', name), desc);
  const body = h('div', 'tbody');
  const inp = h('pre', 'tin');
  const kids = h('div', 'tkids');
  const out = h('pre', 'tout');
  out.hidden = true;
  body.append(inp, kids, out);
  el.append(summary, body);
  container.append(el);
  const card = { id, name, el, desc, inp, kids, out };
  cards.set(id, card);
  follow();
  return card;
}

function shortPath(p) {
  return app.cwd && p.startsWith(app.cwd + '/') ? p.slice(app.cwd.length + 1) : p;
}
const tilde = (p) => (app.home && (p === app.home || p.startsWith(app.home + '/')) ? '~' + p.slice(app.home.length) : p);

function describe(input) {
  if (!input || typeof input !== 'object') return '';
  const v = input.command ?? input.file_path ?? input.notebook_path ?? input.pattern ?? input.url
    ?? input.query ?? input.description ?? input.skill ?? input.prompt ?? '';
  const line = shortPath(String(v).split('\n')[0]);
  return line.length > 140 ? line.slice(0, 139) + '…' : line;
}

function diffLines(oldStr, newStr) {
  const frag = document.createDocumentFragment();
  for (const l of String(oldStr).split('\n')) frag.append(h('span', 'ln-del', '- ' + l));
  for (const l of String(newStr).split('\n')) frag.append(h('span', 'ln-add', '+ ' + l));
  return frag;
}

function inputView(name, input) {
  const frag = document.createDocumentFragment();
  if (name === 'Bash' && input?.command) frag.append('$ ' + input.command);
  else if (name === 'Edit' && input && 'old_string' in input) frag.append(input.file_path + '\n', diffLines(input.old_string, input.new_string));
  else if (name === 'Write' && input && 'content' in input) frag.append(`${input.file_path}\n\n${input.content}`);
  else frag.append(JSON.stringify(input, null, 2));
  return frag;
}

function setCardInput(card, input) {
  card.input = input;
  card.desc.textContent = describe(input);
  card.inp.replaceChildren(inputView(card.name, input));
}

const OUTPUT_LIMIT = 30000;
function resultText(content) {
  if (typeof content === 'string') return content;
  if (Array.isArray(content)) {
    return content.map((b) => (b.type === 'text' ? b.text : `[${b.type}]`)).join('\n');
  }
  return JSON.stringify(content, null, 2);
}

function setCardResult(card, content, isError) {
  let text = resultText(content);
  if (text.length > OUTPUT_LIMIT) text = text.slice(0, OUTPUT_LIMIT) + `\n… ${text.length - OUTPUT_LIMIT} more chars`;
  card.out.textContent = text || '(no output)';
  card.out.hidden = false;
  card.el.dataset.status = isError ? 'error' : 'done';
}

const isToolUse = (t) => t === 'tool_use' || t === 'server_tool_use' || t === 'mcp_tool_use';

// ---------- SDK message handlers
function onStreamEvent(m) {
  const ev = m.event, scope = m.parent_tool_use_id || '';
  if (ev.type === 'message_start') {
    current.set(scope, ev.message.id);
    streamed.add(ev.message.id);
    return;
  }
  const key = `${current.get(scope)}:${ev.index}`;
  if (ev.type === 'content_block_start') {
    const cb = ev.content_block;
    if (cb.type === 'text') blocks.set(key, textBlock(containerFor(scope), cb.text || ''));
    else if (cb.type === 'thinking') blocks.set(key, thinkingBlock(containerFor(scope)));
    else if (isToolUse(cb.type)) {
      const card = cards.get(cb.id) || toolCard(cb.id, cb.name, containerFor(scope));
      blocks.set(key, { kind: 'tool', card, raw: '' });
    }
    return;
  }
  const b = blocks.get(key);
  if (!b) return;
  if (ev.type === 'content_block_delta') {
    const d = ev.delta;
    if (d.type === 'text_delta') { b.raw += d.text; scheduleRender(b); }
    else if (d.type === 'input_json_delta') { b.raw += d.partial_json; b.card.inp.textContent = b.raw; }
    else if (d.type === 'thinking_delta') { b.raw += d.thinking; b.body.textContent = b.raw; }
  } else if (ev.type === 'content_block_stop') {
    blocks.delete(key);
    if (b.kind === 'text') { b.done = true; renderText(b); }
    else if (b.kind === 'thinking') {
      if (b.raw.trim()) b.summary.textContent = 'thinking';
      else b.el.remove();
    } else if (b.kind === 'tool') {
      try { setCardInput(b.card, JSON.parse(b.raw || '{}')); } catch {}
    }
  }
}

function onAssistant(m) {
  const msg = m.message, scope = m.parent_tool_use_id || '';
  for (const b of msg.content || []) {
    if (isToolUse(b.type)) {
      setCardInput(cards.get(b.id) || toolCard(b.id, b.name, containerFor(scope)), b.input);
    } else if (b.tool_use_id && cards.has(b.tool_use_id)) {
      // server tool results (web search etc.) arrive inside the assistant message
      setCardResult(cards.get(b.tool_use_id), b.content, b.content?.type?.endsWith?.('error'));
    } else if (b.type === 'text' && !streamed.has(msg.id)) {
      const t = textBlock(containerFor(scope), b.text);
      t.done = true;
      renderText(t);
    }
  }
  if (m.error) notice(`error: ${m.error}`, 'err');
}

function onUser(m) {
  const content = m.message?.content;
  if (!Array.isArray(content)) return;
  for (const b of content) {
    if (b.type === 'tool_result' && cards.has(b.tool_use_id)) {
      setCardResult(cards.get(b.tool_use_id), b.content, b.is_error);
    }
  }
}

function onResult(m) {
  for (const card of cards.values()) {
    if (card.el.dataset.status === 'running') card.el.dataset.status = 'stopped';
  }
  current.clear();
  blocks.clear();
  const parts = [];
  if (m.subtype !== 'success') parts.push(m.subtype.replace(/_/g, ' '));
  if (m.duration_ms != null) parts.push(`${(m.duration_ms / 1000).toFixed(1)}s`);
  if (m.num_turns) parts.push(`${m.num_turns} turn${m.num_turns === 1 ? '' : 's'}`);
  if (m.usage?.output_tokens) parts.push(`${fmtTok(m.usage.output_tokens)} out`);
  log.append(h('div', `turn-end ${m.is_error ? 'err' : ''}`, parts.join(' · ')));
  // A failed 'success' turn already showed its text via the assistant message.
  if (m.errors?.length) notice(m.errors.join('\n'), 'err');
  follow();
}

function onSystem(m) {
  switch (m.subtype) {
    case 'permission_denied':
      notice(`denied: ${m.tool_name}${m.decision_reason ? ' — ' + m.decision_reason : ''}`, 'warn');
      break;
    case 'compact_boundary':
      notice('context compacted');
      break;
    case 'api_retry':
      notice(`API retry${m.attempt ? ' #' + m.attempt : ''}${m.error ? ': ' + (m.error.message || m.error) : ''}`, 'warn');
      break;
  }
}

function onSdk(m) {
  trackUsage(m);
  switch (m.type) {
    case 'stream_event': return onStreamEvent(m);
    case 'assistant': return onAssistant(m);
    case 'user': return onUser(m);
    case 'result': return onResult(m);
    case 'system': return onSystem(m);
  }
}

// ---------- permission prompts
const pendingPerms = new Map(); // request id -> card element

function button(label, cls, onClick) {
  const b = h('button', cls, label);
  b.type = 'button';
  b.addEventListener('click', onClick);
  return b;
}

function updateTitle() {
  document.title = (pendingPerms.size ? '[approve] ' : app.running ? '\u2026 ' : '') + 'Claude UI';
}

function settlePermission(id, label) {
  const el = pendingPerms.get(id);
  if (!el) return;
  pendingPerms.delete(id);
  el.classList.add('settled');
  el.querySelector('.perm-actions')?.replaceWith(h('div', 'perm-done', label));
  el.querySelectorAll('.q button, .q input').forEach((x) => (x.disabled = true));
  updateTitle();
}

function questionBlocks(questions, answers) {
  return questions.map((q) => {
    const box = h('div', 'q');
    const opts = h('div', 'q-opts');
    const other = h('input', 'q-other');
    other.placeholder = 'Other\u2026';
    const picked = new Set();
    const sync = () => {
      for (const b of opts.children) b.classList.toggle('picked', picked.has(b.dataset.label));
      answers[q.question] = [...picked].join(', ');
    };
    for (const o of q.options || []) {
      const b = button('', '', () => {
        if (!q.multiSelect) picked.clear();
        if (picked.has(o.label)) picked.delete(o.label); else picked.add(o.label);
        other.value = '';
        sync();
      });
      b.dataset.label = o.label;
      b.append(h('b', null, o.label), h('span', null, o.description || ''));
      opts.append(b);
    }
    other.addEventListener('input', () => {
      picked.clear();
      sync();
      answers[q.question] = other.value.trim();
    });
    box.append(h('div', 'q-text', q.question), opts, other);
    return box;
  });
}

function permissionCard(req) {
  const el = h('div', 'perm');
  const head = h('div', 'perm-h');
  head.append(h('span', 'perm-tag', req.toolName === 'AskUserQuestion' ? 'question' : 'permission'), h('b', null, req.toolName));
  if (req.title) head.append(h('span', 'perm-title', req.title));
  el.append(head);

  const reply = (msg, label) => {
    send({ type: 'permission_response', id: req.id, ...msg });
    settlePermission(req.id, label);
  };
  const actions = h('div', 'perm-actions');

  if (req.toolName === 'AskUserQuestion' && Array.isArray(req.input?.questions)) {
    const answers = {};
    el.append(...questionBlocks(req.input.questions, answers));
    actions.append(
      button('Submit', 'primary', () => reply({ allow: true, answers }, 'answered: ' + Object.values(answers).filter(Boolean).join(' / '))),
      button('Skip', 'deny', () => reply({ allow: false }, 'skipped')),
    );
  } else if (req.toolName === 'ExitPlanMode' && typeof req.input?.plan === 'string') {
    const plan = h('div', 'md perm-plan');
    plan.append(mdFragment(req.input.plan));
    decorateCode(plan);
    el.append(plan);
    actions.append(
      button('Approve, ask before edits', 'primary', () => reply({ allow: true, mode: 'default' }, 'plan approved')),
      button('Approve, accept edits', '', () => reply({ allow: true, mode: 'acceptEdits' }, 'plan approved, accepting edits')),
      button('Keep planning', 'deny', () => reply({ allow: false }, 'kept planning')),
    );
  } else {
    const pre = h('pre');
    pre.append(inputView(req.toolName, req.input));
    el.append(pre);
    const why = req.blockedPath ? `blocked path: ${req.blockedPath}` : req.decisionReason;
    if (why) el.append(h('div', 'perm-why', why));
    actions.append(
      button('Allow', 'primary', () => reply({ allow: true }, 'allowed')),
      button('Deny', 'deny', () => reply({ allow: false }, 'denied')),
    );
  }
  el.append(actions);
  log.append(el);
  pendingPerms.set(req.id, el);
  updateTitle();
  stick = true;
  follow();
}

// ---------- permission mode
function showMode(mode) {
  for (const b of document.querySelectorAll('#modes button')) b.classList.toggle('on', b.dataset.mode === mode);
}
for (const b of document.querySelectorAll('#modes button')) {
  b.addEventListener('click', () => send({ type: 'set_mode', mode: b.dataset.mode }));
}

// ---------- status bar
const stats = { model: '', apiKeySource: 'none', ctxTokens: 0, ctxWindow: 0, inTok: 0, outTok: 0, cost: null };

function resetStats() {
  Object.assign(stats, { ctxTokens: 0, inTok: 0, outTok: 0, cost: null });
  renderStatus();
}

function fmtTok(n) {
  if (n >= 1e6) return (n / 1e6).toFixed(n >= 1e7 ? 0 : 1).replace(/\.0$/, '') + 'M';
  if (n >= 1e3) return (n / 1e3).toFixed(n >= 1e4 ? 0 : 1).replace(/\.0$/, '') + 'k';
  return String(n);
}

function renderStatus() {
  const parts = [];
  const seg = (text, cls = '', title = '') => {
    const e = h('span', cls, text);
    if (title) e.title = title;
    parts.push(e);
    return e;
  };
  seg(stats.model ? stats.model.replace(/^claude-/, '') : 'model: default', '', 'Model');
  seg(tilde(app.cwd), 'clip', app.cwd);
  if (app.sessionId) {
    const b = h('button', null, `session ${app.sessionId.slice(0, 8)}`);
    b.title = `${app.sessionId} (click to copy)`;
    b.addEventListener('click', () => navigator.clipboard.writeText(app.sessionId).then(() => notice(`copied session ID ${app.sessionId}`)));
    parts.push(b);
  } else {
    seg('new session');
  }
  parts.push(h('span', 'grow'));
  if (stats.ctxTokens) {
    const pct = stats.ctxWindow ? Math.round((stats.ctxTokens / stats.ctxWindow) * 100) : null;
    const text = `ctx ${fmtTok(stats.ctxTokens)}` + (pct != null ? `/${fmtTok(stats.ctxWindow)} ${pct}%` : '');
    seg(text, pct >= 90 ? 'err' : pct >= 70 ? 'warn' : '', 'Context used by the last request');
  }
  if (stats.inTok || stats.outTok) {
    seg(`in ${fmtTok(stats.inTok)} \u00b7 out ${fmtTok(stats.outTok)}`, '', 'Session tokens (input includes cache reads/writes)');
  }
  if (stats.cost != null) {
    seg(`$${stats.cost.toFixed(stats.cost < 1 ? 3 : 2)} est.`, '', 'Estimated API-equivalent cost of this session (counts against your Agent SDK credit)');
  }
  if (stats.apiKeySource && stats.apiKeySource !== 'none') {
    seg(`billing: ${stats.apiKeySource}`, 'warn', 'Requests are authenticated with an API key, not your subscription');
  }
  const bar = $('#status');
  bar.replaceChildren();
  parts.forEach((p, i) => {
    const prev = parts[i - 1];
    if (i && !p.classList.contains('grow') && !prev.classList.contains('grow')) bar.append(h('span', 'sep', '\u2502'));
    bar.append(p);
  });
}

function trackUsage(m) {
  if (m.type === 'system' && m.subtype === 'init') {
    stats.model = m.model;
    stats.apiKeySource = m.apiKeySource;
  } else if (m.type === 'assistant' && !m.parent_tool_use_id && m.message?.usage) {
    const u = m.message.usage;
    stats.ctxTokens = (u.input_tokens || 0) + (u.cache_read_input_tokens || 0)
      + (u.cache_creation_input_tokens || 0) + (u.output_tokens || 0);
    if (m.message.model) stats.model = m.message.model;
  } else if (m.type === 'result') {
    if (typeof m.total_cost_usd === 'number') stats.cost = m.total_cost_usd;
    const models = Object.entries(m.modelUsage || {});
    if (models.length) {
      stats.inTok = stats.outTok = 0;
      for (const [, u] of models) {
        stats.inTok += u.inputTokens + u.cacheReadInputTokens + u.cacheCreationInputTokens;
        stats.outTok += u.outputTokens;
      }
      const main = m.modelUsage[stats.model] || models.sort((a, b) => b[1].costUSD - a[1].costUSD)[0][1];
      stats.ctxWindow = main.contextWindow || stats.ctxWindow;
    }
  } else {
    return;
  }
  renderStatus();
}

// ---------- transcript reset + history replay
function clearTranscript() {
  log.replaceChildren();
  cards.clear(); blocks.clear(); current.clear(); streamed.clear();
  stick = true;
}

const HISTORY_LIMIT = 400;
function renderHistory(messages) {
  clearTranscript();
  const shown = messages.slice(-HISTORY_LIMIT);
  if (messages.length > shown.length) notice(`${messages.length - shown.length} earlier messages not shown`);
  for (const m of shown) {
    if (m.type === 'assistant') onAssistant({ message: m.message, parent_tool_use_id: m.parent_tool_use_id });
    if (m.type !== 'user') continue;
    const c = m.message?.content;
    const text = typeof c === 'string' ? c
      : Array.isArray(c) ? c.filter((b) => b.type === 'text').map((b) => b.text).join('\n') : '';
    // Skip injected context such as <system-reminder> or <command-name> blocks.
    if (text.trim() && !m.parent_tool_use_id && !/^\s*<[a-z-]+>/i.test(text)) userBubble(text);
    onUser(m);
  }
  for (const card of cards.values()) {
    if (card.el.dataset.status === 'running') card.el.dataset.status = 'stopped';
  }
  notice('resumed \u2014 new messages continue this session');
  chat.scrollTop = chat.scrollHeight;
}

// ---------- sidebar
function ago(ms) {
  const s = (Date.now() - ms) / 1000;
  if (s < 60) return 'now';
  if (s < 3600) return `${Math.floor(s / 60)}m`;
  if (s < 86400) return `${Math.floor(s / 3600)}h`;
  if (s < 86400 * 30) return `${Math.floor(s / 86400)}d`;
  return new Date(ms).toLocaleDateString();
}

function renderSidebar() {
  renderStatus();
  const recent = $('#recent');
  recent.replaceChildren(...app.recentDirs.map((d) => {
    const li = h('li', d === app.cwd ? 'active' : '', tilde(d));
    li.title = d;
    li.addEventListener('click', () => setCwd(d));
    return li;
  }));
  const list = $('#sessions');
  if (!app.sessions.length) return list.replaceChildren(h('li', 'empty', 'No sessions in this directory yet'));
  list.replaceChildren(...app.sessions.map((s) => {
    const li = h('li', s.id === app.sessionId ? 'active' : '');
    li.title = s.id;
    li.append(h('span', 's-title', s.title), h('span', 's-meta', `${ago(s.updatedAt)} \u00b7 ${s.id.slice(0, 8)}`));
    li.addEventListener('click', () => resume(s.id));
    return li;
  }));
}

function guardIdle() {
  if (!app.running) return true;
  notice('Stop the current run first.', 'warn');
  return false;
}
function setCwd(dir) { if (guardIdle() && dir) send({ type: 'set_cwd', cwd: dir }); }
function resume(id) { if (guardIdle() && id && id !== app.sessionId) send({ type: 'resume', sessionId: id }); }

$('#cwd-form').addEventListener('submit', (e) => { e.preventDefault(); setCwd($('#cwd-input').value.trim()); });
$('#resume-form').addEventListener('submit', (e) => {
  e.preventDefault();
  resume($('#resume-input').value.trim());
  $('#resume-input').value = '';
});
$('#new-btn').addEventListener('click', () => {
  if (!guardIdle()) return;
  send({ type: 'new_session' });
  clearTranscript();
  input.focus();
});
$('#side-btn').addEventListener('click', () => document.body.classList.toggle('side-hidden'));
if (window.innerWidth < 760) document.body.classList.add('side-hidden');

// ---------- connection
function banner(text, cls = '', action) {
  const b = $('#banner');
  b.hidden = !text;
  b.className = cls;
  b.replaceChildren();
  if (!text) return;
  b.append(h('span', null, text));
  if (action) {
    const btn = h('button', null, action.label);
    btn.type = 'button';
    btn.addEventListener('click', action.run);
    b.append(btn);
  }
}

function send(msg) {
  if (app.ws?.readyState === WebSocket.OPEN) app.ws.send(JSON.stringify(msg));
}

function setRunning(running) {
  app.running = running;
  if (!running) for (const id of [...pendingPerms.keys()]) settlePermission(id, 'cancelled');
  updateTitle();
  sendBtn.textContent = running ? 'Stop' : 'Send';
  sendBtn.className = running ? 'danger' : 'primary';
}

function connect() {
  const ws = new WebSocket(`ws://${location.host}/ws`);
  app.ws = ws;
  ws.addEventListener('open', () => banner(null));
  ws.addEventListener('message', (e) => {
    const msg = JSON.parse(e.data);
    switch (msg.type) {
      case 'hello':
        app.home = msg.home;
        if (msg.apiKeyPresent) {
          banner('ANTHROPIC_API_KEY is set in the server environment: usage bills the API, not your subscription.', 'warn');
        }
        break;
      case 'cwd':
        Object.assign(app, { cwd: msg.cwd, recentDirs: msg.recentDirs, sessions: msg.sessions, sessionId: msg.sessionId });
        $('#cwd-input').value = tilde(msg.cwd);
        clearTranscript();
        resetStats();
        renderSidebar();
        break;
      case 'session':
        if (msg.sessionId !== app.sessionId && !app.running) resetStats();
        app.sessionId = msg.sessionId;
        app.sessions = msg.sessions;
        renderSidebar();
        break;
      case 'history': renderHistory(msg.messages); break;
      case 'mode': showMode(msg.mode); break;
      case 'permission_request': permissionCard(msg); break;
      case 'permission_cancel': settlePermission(msg.id, 'cancelled'); break;
      case 'sdk': onSdk(msg.msg); break;
      case 'running': setRunning(msg.running); break;
      case 'error': notice(msg.message, 'err'); break;
    }
  });
  ws.addEventListener('close', () => {
    setRunning(false);
    banner('Disconnected from server.', 'err', { label: 'Reconnect', run: connect });
  });
}

// ---------- composer
function autosize() {
  input.style.height = 'auto';
  input.style.height = input.scrollHeight + 2 + 'px';
}
input.addEventListener('input', autosize);
input.addEventListener('keydown', (e) => {
  if (e.key === 'Enter' && !e.shiftKey && !e.isComposing) {
    e.preventDefault();
    $('#composer').requestSubmit();
  }
});
document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape' && app.running) send({ type: 'interrupt' });
});
$('#composer').addEventListener('submit', (e) => {
  e.preventDefault();
  if (app.running) return send({ type: 'interrupt' });
  const text = input.value.trim();
  if (!text || app.ws?.readyState !== WebSocket.OPEN) return;
  userBubble(text);
  send({ type: 'prompt', text });
  input.value = '';
  autosize();
});

connect();
</script>
